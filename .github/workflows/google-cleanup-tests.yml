name: Userscript deterministic tests

on:
  push:
    paths:
      - '*.user.js'
      - 'adguard-personal.txt'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/google-cleanup-tests.yml'
  pull_request:
    paths:
      - '*.user.js'
      - 'adguard-personal.txt'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/google-cleanup-tests.yml'

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
