name: Personal SERPINFO Add-ons
homepage: https://github.com/usernomom/personal-adblock-filterlist
lastModified: 2026-09-03T01:02:00Z

pages:
  - name: DuckDuckGo News carousel
    matches:
      - https://duckduckgo.com/
      - https://duckduckgo.com/?*
      - https://safe.duckduckgo.com/
      - https://safe.duckduckgo.com/?*
      - https://start.duckduckgo.com/
      - https://start.duckduckgo.com/?*
      - https://noai.duckduckgo.com/
      - https://noai.duckduckgo.com/?*
    delay: true
    commonProps:
      $site: duckduckgo
      $category: web
    results:
      - name: Web > News carousel
        root: [upward, 2, '[data-layout="news"] ol > li > a > article']
        url: a
        props:
          title: h3

  - name: Google Forums (desktop)
    matches: &google_matches
      - https://www.google.com/search?*
      - https://www.google.ca/search?*
      - https://www.google.fr/search?*
      - https://www.google.co.uk/search?*
    includeRegex: "[?&]udm=(18|forums)(&|$)"
    userAgent: desktop
    results:
      - name: Default
        root: ".vt6azd:not(.g-blk), .Ww4FFb"
        url:
          - or
          - - [regexInclude, "^https?://", [attribute, href, ":is(.yuRUbf, .xe8e1b) a"]]
            - [domainToURL, cite]
        props:
          title: h3
    commonProps:
      $site: google
      $category: web

  - name: Google Forums (mobile)
    matches: *google_matches
    includeRegex: "[?&]udm=(18|forums)(&|$)"
    userAgent: mobile
    results:
      - name: Default
        root: ".vt6azd, .Ww4FFb"
        url:
          - or
          - - [regexInclude, "^https?://", [attribute, href, '.UBFage, a[role="presentation"]']]
            - [domainToURL, ".ob9lvb"]
        props:
          title: '[role="heading"][aria-level="3"]'
        button: [inset, { top: "16px", right: "32px" }]
    commonProps:
      $site: google
      $category: web
